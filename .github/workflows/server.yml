name: Test the online server

on:
  push:
    branches: [main]
    paths: ["server/**", "spec/rules/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "spec/rules/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run the unit tests
        run: npm test

      - name: Run the Worker end to end
        run: npm run test:worker
